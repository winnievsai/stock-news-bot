name: Fetch Stock Data

on:
  schedule:
    - cron: "0 */2 * * *"   # 每 2 小時（UTC），跟台灣時間差 8 小時
  workflow_dispatch: {}      # 允許在 Actions 分頁手動點按鈕測試

permissions:
  contents: write   # 執行完要 commit 更新後的 CSV 回 repo，需要寫入權限

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Taiwan stock prices
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_finmind.py

      - name: Update Taiwan stock news
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_news.py

      - name: Update US stock prices
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_us_stock.py

      - name: Update US stock news
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_us_news.py

      - name: Update market-wide news
        run: python3 update_market_news.py

      - name: Cross-check prices against Yahoo Finance
        run: python3 validate_prices.py

      - name: Save updated data back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data news us_data us_news market_news
          git commit -m "Fetch data update" || echo "No changes to commit"
          git push
