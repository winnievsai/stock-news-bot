name: Daily Stock Update

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 台灣時間 08:00
  workflow_dispatch: {}    # 允許在 Actions 分頁手動點按鈕測試

permissions:
  contents: write   # 執行完要 commit 更新後的 CSV 回 repo，需要寫入權限

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Taiwan stock prices
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_finmind.py

      - name: Update Taiwan stock news
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_news.py

      - name: Update US stock prices
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_us_stock.py

      - name: Update US stock news
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 update_us_news.py

      - name: Send daily digest email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 send_news_email_resend.py

      - name: Save updated data back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data news us_data us_news
          git commit -m "Daily data update" || echo "No changes to commit"
          git push
